name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    # Python 3.9 недоступен на ubuntu-26.04, используем совместимый runner.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        id: setup-python
        continue-on-error: true
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-python@v7
        if: steps.setup-python.outcome == 'failure'
        with:
          python-version: ${{ matrix.python }}
      - run: python --version
      - run: python -m compileall -q server.py profiles.py max_profile.py assistant_max.py config.py access.py glagol.py multi.py pyadb.py dsp_max.py party.py party_store.py party_audio.py api
      - run: pip install pytest pytest-asyncio
      - run: pytest
      - run: python -m unittest discover -s tests -v
      - run: python server.py --help
      - run: python multi.py --help
      - run: |
          sh -n start.sh
          sh -n start.command
      - run: node tests/test_renderer.mjs
      - run: node tests/test_ui_hardening.mjs
      - run: node tests/test_paths.mjs
      - run: node tests/test_model_studio.cjs
      - run: node tests/test_catalog.cjs
      - run: node tests/test_update_ui.cjs
      - run: node tests/test_voice_input.mjs

  assistant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device/assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: device/assistant/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o /dev/null .

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: device/agent/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o /dev/null .

  viz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device/viz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: device/viz/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o /dev/null .
