name: release

# Метка vX.Y.Z → релиз на GitHub с готовыми ZIP для Windows (панель + портативный Python).
# Вручную (workflow_dispatch) — только собрать ZIP и приложить к запуску как артефакт.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Метка совпадает с VERSION
        if: github.ref_type == 'tag'
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" || { echo "метка $GITHUB_REF_NAME, а в VERSION $(cat VERSION)"; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: device/assistant/go.mod
      - name: Сборка
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VER="dev-${GITHUB_SHA::7}"
          .github/build-windows-zip.sh "$VER" amd64 dist
          .github/build-windows-zip.sh "$VER" arm64 dist
          # программа помощника для колонки: панель без Go скачивает её с релиза и сверяет SHA256SUMS
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go -C device/assistant build -trimpath \
            -ldflags "-s -w -X main.version=$VER" -o "$PWD/dist/assistantd-linux-arm64" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go -C device/agent build -trimpath \
            -ldflags "-s -w -X main.version=$VER" -o "$PWD/dist/yapanel-agent-linux-arm64" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go -C device/viz build -trimpath \
            -ldflags "-s -w -X main.version=$VER" -o "$PWD/dist/vizd-linux-arm64" .
          (cd dist && sha256sum assistantd-linux-arm64 yapanel-agent-linux-arm64 vizd-linux-arm64 > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
      - name: Релиз
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/assistantd-linux-arm64 dist/yapanel-agent-linux-arm64 dist/vizd-linux-arm64 dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/assistantd-linux-arm64 dist/yapanel-agent-linux-arm64 dist/vizd-linux-arm64 dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes --notes "$(cat <<'NOTES'
          **Windows:** скачайте `…-windows-x64.zip` (или `arm64` для ARM-ноутбуков), распакуйте и запустите `start.bat`.
          Python уже внутри; adb (и по желанию ffmpeg) `start.bat` скачает сам при первом запуске.

          **Android:** `yapanel-web-….apk` — панель целиком в приложении (Android 7+, 64 бита), колонка — по Wi-Fi.

          **Linux / macOS / Docker:** см. README.
          NOTES
          )"
          fi
