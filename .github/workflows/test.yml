name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ['3.9', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q server.py model_colors.py profiles.py midi.py managed_yam.py multi.py tools/midi_readonly.py
      - run: python -m unittest discover -s tests -v
      - run: python server.py --help
      - run: python multi.py --help
      - run: |
          sh -n start.sh
          sh -n start.command
      - run: node tests/test_renderer.mjs
      - run: node tests/test_paths.mjs
      - run: node tests/test_model_studio.cjs
      - run: node tests/test_model_midi.mjs
      - run: node tests/test_catalog.cjs
      - run: node tests/test_update_ui.cjs
      - run: node tests/test_voice_input.mjs
      - run: node tests/test_redaction.cjs
      - run: node tests/test_midi_ui.cjs
      - run: node tests/test_midi_color_ui.cjs
      - run: node tests/test_midi_clock_ui.cjs

  model-colour-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_model_color_browser.cjs

  assistant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device/assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: device/assistant/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o /dev/null .

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: device/agent/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o /dev/null .

  viz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device/viz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: device/viz/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o /dev/null .
